# Netlify build configuration.
# This file is read by Netlify when the GitHub repo is connected to the site.
# Local development is unaffected.

[build]
  command = "npm run build"
  publish = "dist"

# Use the LTS Node version Vite expects.
[build.environment]
  NODE_VERSION = "20"

# Pull Request previews keep the same build settings.
[context.deploy-preview]
  command = "npm run build"

# public/_headers is copied to dist and applies security and cache headers on
# both Netlify and Cloudflare Workers static asset deployments.
