# Netlify build configuration.
# This file is read by Netlify when the GitHub repo is connected to the site.
# Local development is unaffected.

[build]
  command = "npm run build"
  publish = "dist"

# Use the LTS Node version Vite expects.
[build.environment]
  NODE_VERSION = "20"

# Pull Request previews keep the same build settings.
[context.deploy-preview]
  command = "npm run build"

# Security headers applied to every response. CSP is intentionally left off
# until we can verify Supabase + Judge0 + fonts.googleapis.com domains in
# production; add it back here once tested.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Long-cache the hashed asset files Vite emits. They get a fresh hash on
# every build so they're safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
