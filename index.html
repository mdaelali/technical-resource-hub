<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />

    <title>Technical Resource Hub | Learn computer science by doing</title>
    <meta name="description" content="Learn core computer science concepts, practise Java, Python, and C++, and build a study habit with a focused learning workspace." />
    <meta name="theme-color" content="#fbfaf7" />

    <!-- Open Graph / link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alihasanli.com/" />
    <meta property="og:title" content="Technical Resource Hub | Learn computer science by doing" />
    <meta property="og:description" content="Understand CS concepts, write and run code, and track your progress as you learn." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Technical Resource Hub" />
    <meta name="twitter:description" content="Understand CS concepts, write and run code, and track your progress as you learn." />

    <!-- Warm up the three external origins the app will hit on first paint.
         Avoids a serial DNS + TLS handshake delay on first render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://wsgwswwnxfbaqwzdtans.supabase.co" crossorigin />

    <!-- Load fonts as a <link> in HTML instead of @import in CSS.
         @import inside index.css is render-blocking because the browser has
         to fetch the CSS file before it even knows the @import URL exists. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
