# Cloudflare Workers static-asset deployment config.
# Tells `wrangler deploy` to upload everything in ./dist as static assets and
# fall back to index.html for unknown paths — required for our hash-routed
# SPA (#/dashboard, #/profile, etc.) to work directly when shared.

name = "technical-resource-hub"
compatibility_date = "2025-05-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
